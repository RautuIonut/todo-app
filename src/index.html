<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo app</title>
</head>
<body>
  <div class="sidebar">
    <div class="add">
      <input class='add-input' type="text" placeholder='Add a new list' minlength='3' maxlength='16'>
      <button class='add-btn'>Add</button>
    </div>
  </div>
  <div class="header">
    <div>
      <h1 class='title'></h1>
      <p class='counter'></p>
    </div>
    <button class='add-todo-btn'>Add</button>
    <button class='delete-list-btn'>Remove</button>
  </div>
  <div class="content">
    
  </div>

  <form class='hidden'>
    <div>
      <label for="title">Title</label>
      <input type="text" id='title' name='title' minlength='3' maxlength='20'>
    </div>
    <div>
      <label for="description">Description</label>
      <input type="text" id='description' name='title' minlength='3' maxlength='35'>
    </div>
    <div>
      <label for="date">Due Date</label>
      <input type="date" id='date' name='title'>
    </div>
    <div>
      <label for="priority">Priority</label>
      <select name="priority" id="priority">
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
      </select>
    </div>
    <button id='save-btn'>save</button>
    <button class='cancel-btn'>Cancel</button>
  </form>
</body>
</html>
